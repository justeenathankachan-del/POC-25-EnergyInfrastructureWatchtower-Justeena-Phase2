services:
  watchtower-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: poc25-energy-watchtower:phase2
    container_name: poc25-energy-watchtower
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s